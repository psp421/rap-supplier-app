specVersion: "3.0"
metadata:
  name: rap-supplier-app
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.fe.templates
    - name: sap.fe.core
    - name: sap.ui.fl
    - name: sap.ui.mdc
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            # Replace <YOUR-ABAP-CLOUD-HOST> with your JFA system hostname
            # Find it in: BTP Cockpit > Instances & Subscriptions > ABAP Cloud instance > Endpoints
            # Example: my-abap-system.abap.eu10.hana.ondemand.com
            url: https://<YOUR-ABAP-CLOUD-HOST>
            destination: JFA
            scp: true
    - name: fiori-tools-appreload
      afterMiddleware: fiori-tools-proxy
      configuration:
        port: 35729
        path: webapp
